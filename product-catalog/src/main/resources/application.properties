# Server Configuration
load_packages="com.customer.order.service"
server.port=8081
spring.application.name=product.catalog
# MariaDB Connection Settings
spring.datasource.url=jdbc:mariadb://localhost:33006/catalog_db
spring.datasource.username=pyur
spring.datasource.password=admin
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# Values must be exactly 'true' or 'false' in 3.5+
spring.threads.virtual.enabled=false
# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true

# Data Seeding
# Ensures data.sql is executed to seed po-1, po-2, po-3
spring.sql.init.mode=always