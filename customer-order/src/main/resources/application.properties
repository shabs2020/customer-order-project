# Server Configuration
load_packages="com.customer.order.service"
server.port=8080
# MariaDB Connection Settings
spring.datasource.url=jdbc:mariadb://localhost:33106/order_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# Values must be exactly 'true' or 'false' in 3.5+
spring.threads.virtual.enabled=false
# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true

# Catalog Client Config
catalog.service.url.base=http://localhost:8081
